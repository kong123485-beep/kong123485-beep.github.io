<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dee's Library + N3_N5</title>
<style>
  :root{--bg:#fbfbfa;--text:#111113;--border:#ececf0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0}
  .wrap{max-width:1120px;margin:0 auto;padding:24px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media(max-width:768px){.grid{grid-template-columns:1fr}}
  .card{background:white;border:1px solid var(--border);border-radius:16px;padding:16px;transition:.15s;text-decoration:none;color:inherit;display:block}
  .card:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.06);border-color:rgba(0,0,0,.1)}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;color:white;margin-left:6px}
  .repo{font-size:11px;color:#6b7280;margin-top:4px}
  h1{font-size:32px;margin:0}
  .filter{margin:20px 0;display:flex;flex-wrap:wrap;gap:8px}
  .filter button{padding:8px 14px;border-radius:20px;border:1px solid #e5e7eb;background:white;cursor:pointer;font-size:13px}
  .filter button.active{background:black;color:white;border-color:black}
  .section{margin-top:40px}
  .section h2{font-size:20px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 dee's Library</h1>
  <p style="color:#6b7280;font-size:13px">保留之前網頁・只加 https://kong123485-beep.github.io/N3_N5/</p>
  <div class="filter" id="filters"></div>
  <div id="content"></div>
</div>
<script>
const docs=[
{id:"jlpt-index",repo:"JLPT",title:"Index.html",badge:"UPDATED",badgeColor:"#6366f1",desc:"JLPT 溫習總目錄",href:"https://kong123485-beep.github.io/JLPT/Index.html",icon:"📚"},
{id:"topik-72",repo:"TOPIK",title:"72.html",badge:"TOPIK 基礎",badgeColor:"#f43f5e",desc:"72句核心句型",href:"https://kong123485-beep.github.io/TOPIK/72.html",icon:"🇰🇷"},
{id:"topik-94",repo:"TOPIK",title:"Topik-94.html",badge:"TOPIK 精選",badgeColor:"#f43f5e",desc:"TOPIK 94題精選",href:"https://kong123485-beep.github.io/TOPIK/Topik-94.html",icon:"🇰🇷"},
{id:"topik-study",repo:"TOPIK",title:"Topik_study.html",badge:"NEW",badgeColor:"#f43f5e",desc:"TOPIK 學習總整合",href:"https://kong123485-beep.github.io/TOPIK/Topik_study.html",icon:"🇰🇷"},
{id:"bible-index",repo:"Bible",title:"index.html",badge:"NEW",badgeColor:"#10b981",desc:"Bible 總目錄",href:"https://kong123485-beep.github.io/bible/index.html",icon:"✝"},
{id:"bible-verses",repo:"Bible",title:"bible-verses.html",badge:"金句集",badgeColor:"#06b6d4",desc:"金句集中英對照",href:"https://kong123485-beep.github.io/dee/bible-verses.html",icon:"✝"},
{id:"bible-psalm",repo:"Bible",title:"psalm-1-23.html",badge:"詩篇默想",badgeColor:"#8b5cf6",desc:"詩篇1-23默想",href:"https://kong123485-beep.github.io/dee/psalm-1-23.html",icon:"✝"},
{id:"bible-four",repo:"Bible",title:"english-four-lang.html",badge:"四語對照",badgeColor:"#f59e0b",desc:"四語對照",href:"https://kong123485-beep.github.io/dee/english-four-lang.html",icon:"✝"},
{id:"history-index",repo:"History",title:"Index.html",badge:"UPDATED",badgeColor:"#f59e0b",desc:"History 總目錄",href:"https://kong123485-beep.github.io/History/Index.html",icon:"🏛"},
{id:"dse-index",repo:"DSE",title:"index.html",badge:"NEW",badgeColor:"#0ea5e9",desc:"DSE 總目錄",href:"https://kong123485-beep.github.io/DSE/index.html",icon:"🎓"},
{id:"travel-index",repo:"Travel",title:"index.html",badge:"NEW",badgeColor:"#f97316",desc:"Travel 總目錄",href:"https://kong123485-beep.github.io/travel/index.html",icon:"✈"},
{id:"n3n5-index",repo:"N3_N5",title:"N3_N5",badge:"NEW",badgeColor:"#6366f1",desc:"N3_N5 日語學習・Cheatsheet・單字庫・Quiz",href:"https://kong123485-beep.github.io/N3_N5/",icon:"📚"},
];
const repos=["ALL","JLPT","N3_N5","TOPIK","Bible","History","DSE","Travel"];
let active="ALL";
function renderFilters(){
  const f=document.getElementById('filters');
  f.innerHTML=repos.map(r=>`<button class="${active===r?'active':''}" onclick="setFilter('${r}')">${r}</button>`).join('');
}
function setFilter(r){active=r;renderFilters();renderContent();}
function renderContent(){
  const c=document.getElementById('content');
  const filtered=active==="ALL"?docs:docs.filter(d=>d.repo===active);
  const grouped={};
  filtered.forEach(d=>{(grouped[d.repo]=grouped[d.repo]||[]).push(d)});
  c.innerHTML=Object.entries(grouped).map(([repo,list])=>`
    <div class="section">
      <h2><span style="width:10px;height:10px;border-radius:50%;background:${list[0].badgeColor};display:inline-block"></span> ${repo} <span style="font-size:12px;color:#999">(${list.length})</span></h2>
      <div class="grid">
        ${list.map(d=>`
          <a class="card" href="${d.href}" target="_blank">
            <div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px">${d.icon}</span><b>${d.title}</b><span class="badge" style="background:${d.badgeColor}">${d.badge}</span></div>
            <div class="repo">${d.desc}</div>
            <div style="font-size:11px;color:#9ca3af;margin-top:6px;word-break:break-all">${d.href}</div>
          </a>
        `).join('')}
      </div>
    </div>
  `).join('');
}
renderFilters();renderContent();
</script>
</body>
</html>
